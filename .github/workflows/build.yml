name: Brickbound build and combat rules
on:
  pull_request:
    branches: [main, feat/world1-rootheart-pass2]
  push:
    branches: [main]
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Syntax check
        run: node --check src/game.js
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
